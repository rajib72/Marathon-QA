<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <div class="class_guide-builder" style="background-color: white;">
    <div class="slds-card slds-theme_shade" if:true={isError}>
        <div class="slds-card__header slds-grid">
          <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
            <h2>{placeholdererrorText}</h2>
            </div>
        </div>
    </div>
    <div class="slds-card slds-theme_shade" if:true={isSuccess}>
        <div class="slds-card__header slds-grid">
          <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_success" role="status">
            <h2>{placeholderSuccessText}</h2>
            </div>
        </div>
    </div>
    <div class ='slds-p-around_x-small slds-grid'>
        <div class="slds-p-horizontal_small slds-col slds-size_1-of-12"></div>
        <div class="slds-p-horizontal_small slds-col slds-size_10-of-12">
            <div class="slds-p-around_x-small slds-grid">
                <div class="slds-p-horizontal_small slds-col slds-size_1-of-3"></div>
                <div class="slds-p-horizontal_small slds-col slds-size_1-of-3">
                    <lightning-combobox
                        class ="classGuideName"
                        name="classGuideName"
                        label="Class Guide Name"
                        value={placeholerClassGuideName}
                        placeholder={placeholerClassGuideName}
                        options={optionsclassGuideName}
                        onchange={handleclassGuideNameChange} ></lightning-combobox>
                </div>
                <div class="slds-p-horizontal_small slds-col slds-size_1-of-3"></div>
            </div>
            <div if:true={showNewClassGuideFields}>
                <div class="slds-p-around_x-small slds-grid">
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-12"></div>
                    <div class="slds-p-horizontal_small slds-col slds-size_5-of-12">
                        <label class="slds-form-element__label">New Class Guide Name</label> 
                        <div class="slds-input-has-icon slds-input-has-icon_right">
                        <lightning-input type="text" value={valueNewClassGuide} onchange={newClassGuideChange} variant="label-hidden" class = "newClassText-input"></lightning-input>
                        </div>
                    </div>
                    <div class="slds-p-horizontal_small slds-col slds-size_5-of-12">
                        <label class="slds-form-element__label">Partner</label> 
                        <div class="slds-input-has-icon slds-input-has-icon_right">
                        <lightning-input type="text" value={valuePartner} onchange={partnerChange} variant="label-hidden" class = "newPartnerText-input"></lightning-input>
                        </div>
                    </div>
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-12"></div>
                </div>
            </div>
            <div class = "slds-p-around_x-small" if:true={showClassGuideBuilderFilters}>

                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3">

                            class="ethnicity-input-checkbox"
                            name="ethnicity-input"
                            label="Ethnicity"
                            value={valueEthnicity}
                            options={optionsEthnicity}
                            placeholder={valueEthnicity}
                            onchange={handleChangeEthnicity} ></lightning-combobox>
                    </div>
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3">   
                                <label class="slds-form-element__label">Makes</label>

                                <lightning-icon icon-name="utility:down" size="xx-small" class="slds-icon slds-input__icon" 
                                                                        style="margin-right:-0.2rem;top:15px;"></lightning-icon>
                                <lightning-input type="text" placeholder={placeholderMakes} value={makesValue}  variant="label-hidden" onclick={showPicklistLogic} class = "makes-input"></lightning-input>

                                        <ul class="slds-listbox slds-listbox_vertical">

                                                    <lightning-input type="checkbox" value='SelectAll' class='select-all-makes' checked onchange={onSelect}></lightning-input>
                                                </template>
                                                <template if:false={selectAllMakes}>
                                                    <lightning-input type="checkbox" value='SelectAll' class='select-all-makes-unchecked' onchange={onSelect}></lightning-input>

                                            </span>

                                                        <span class="slds-media__figure slds-listbox__option-icon">

                                                                    <lightning-input type="checkbox" value={option.label} checked onchange={onSelect} class="makes-input-checkbox"></lightning-input>
                                                                </template>
                                                                <template if:false={option.checked}>
                                                                    <lightning-input type="checkbox" value={option.label} onchange={onSelect} class="makes-input-checkbox"></lightning-input>
                                                                </template>
                                                        </span>
                                                        <span class="slds-media__body">
                                                            <span class="slds-truncate" title={option.label}>{option.label}</span>
                                                        </span>
                                                        </div>                                
                                                    </li>
                                                </template>
                                            </template>
                                        </ul>
                                    </div>
                                </template>

                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>

                                                <span class="slds-media__figure slds-listbox__option-icon">                                        
                                                        <template if:true={option.checked}>
                                                            <lightning-input type="checkbox" value={option.label} checked onchange={onSelect} class="tonnage-input-checkbox"></lightning-input>
                                                        </template>
                                                        <template if:false={option.checked}>
                                                            <lightning-input type="checkbox" value={option.label} onchange={onSelect} class="tonnage-input-checkbox"></lightning-input>
                                                        </template>
                                                </span>
                                                <span class="slds-media__body">
                                                    <span class="slds-truncate" title={option.label}>{option.label}</span>
                                                </span>
                                                </div>                                
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </template>  
                    </div>
                        </div>
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3">   
                        <label class="slds-form-element__label">VIN Prefix</label> 
                        <div class="slds-input-has-icon slds-input-has-icon_right">
                        <lightning-input type="text" value={valueVINPrefix} onchange={populateOptionsText} variant="label-hidden" class = "vinPrefix-input" disabled={isDisabled}></lightning-input> 
                    </div>
                    </div>
                </div>
                <div class="slds-p-around_x-small slds-grid">
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3"></div>
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3">   
                        <label class="slds-form-element__label">Rate Class</label> 
                        <div class="slds-input-has-icon slds-input-has-icon_right">
                        <lightning-input type="text" value={valueRateClass} onchange={populateOptionsText} variant="label-hidden" class = "rateClass-input"></lightning-input>
                    </div>
                    </div>
                    <div class="slds-p-horizontal_small slds-col slds-size_1-of-3"></div>
                </div>
                <div class="slds-p-around_x-small " style="text-align:center">
                        <lightning-button 
                        label="Save" 
                        onclick={saveClassGuide} 
                        class="slds-m-top_medium"
                        variant="brand-outline"
                        disabled={isDisabled}>
                    </lightning-button>
                </div>
            </div>
        </div>
        <div class="slds-p-horizontal_small slds-col slds-size_1-of-12"></div>
    </div>
</div>
</template>
