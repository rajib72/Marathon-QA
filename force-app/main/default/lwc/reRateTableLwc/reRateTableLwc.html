<template>
    <div class="slds-p-vertical_x-small">
        <!-- 1. Coverage Level (Shown for both Auto & Home) -->
        <lightning-combobox
            name="coverageLevel"
            label="Coverage Level"
            value={selectedCoverageId}
            options={coverageOptions}
            onchange={handleCoverageChange}
            placeholder="Select Coverage Level">
        </lightning-combobox>

        <!-- 2. Sale Odometer (Shown ONLY for Auto contracts) -->
        <template if:true={isAutoProduct}>
            <lightning-input
                type="number"
                name="saleMileage"
                label="Sale Odometer"
                value={saleMileage}
                onchange={handleMileageChange}
                class="slds-m-top_small">
            </lightning-input>
        </template>

        <!-- Eligibility Warning if matrix has 0 matching rows -->
        <template if:true={noMatchingRowsWarning}>
            <div class="slds-text-color_error slds-m-top_xx-small slds-text-body_small">
                No eligible rate rows found in the matrix for this Coverage Level and contract attributes.
            </div>
        </template>

        <!-- 3. Contract Term Months (Shown for both Auto & Home) -->
        <lightning-combobox
            name="termMonths"
            label="Contract Term Months"
            value={selectedMonths}
            options={monthOptions}
            onchange={handleMonthChange}
            placeholder="Select Contract Term Months"
            class="slds-m-top_small">
        </lightning-combobox>

        <!-- 4. Contract Term Miles (Shown ONLY for Auto contracts) -->
        <template if:true={isAutoProduct}>
            <lightning-combobox
                name="termMiles"
                label="Contract Term Miles"
                value={selectedMiles}
                options={mileOptions}
                onchange={handleMileChange}
                placeholder="Select Contract Term Miles"
                class="slds-m-top_small">
            </lightning-combobox>
        </template>

        <!-- 5. Deductible (Shown for both Auto & Home) -->
        <lightning-combobox
            name="deductible"
            label="Deductible"
            value={selectedDeductible}
            options={deductibleOptions}
            onchange={handleDeductibleChange}
            placeholder="Select Deductible"
            class="slds-m-top_small">
        </lightning-combobox>

        <!-- 6. Option1 (Filtered by active Option Set & refreshed on Coverage Level change) -->
        <div class="slds-form-element slds-m-top_small">
            <label class="slds-form-element__label">
                <strong>Option1</strong>
            </label>
            <div class="slds-form-element__control">
                <template if:true={hasOptionItems}>
                    <div class="slds-grid slds-wrap">
                        <template for:each={optionItems} for:item="opt">
                            <div key={opt.value} class="slds-m-right_medium slds-m-bottom_x-small">
                                <lightning-input
                                    type="checkbox"
                                    label={opt.label}
                                    name={opt.value}
                                    checked={opt.checked}
                                    onchange={handleOptionChange}>
                                </lightning-input>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={hasOptionItems}>
                    <div class="slds-text-color_weak slds-text-body_small">
                        No options available for the active Option Set.
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
